name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: ./gradlew test

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish to GitHub Packages when the version is new
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q properties | awk -F': ' '/^version: / { print $2; exit }')
          URL="https://maven.pkg.github.com/sunrun/sr-sec-kt-sns-logger/com/sunrun/security/sr-sec-kt-sns-logger/${VERSION}/sr-sec-kt-sns-logger-${VERSION}.pom"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "$URL")
          if [ "$CODE" = "200" ]; then
            echo "com.sunrun.security:sr-sec-kt-sns-logger:${VERSION} is already published. Bump version in build.gradle.kts to release another jar."
            exit 0
          fi
          ./gradlew publish
